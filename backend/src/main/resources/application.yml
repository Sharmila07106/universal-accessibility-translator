spring:
  application:
    name: uat-backend
  config:
    import: optional:file:../docker/.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:humanbridge_db}?options=-c%20timezone=UTC
    username: ${POSTGRES_USER:devuser}
    password: ${POSTGRES_PASSWORD:devpassword}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
